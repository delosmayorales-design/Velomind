<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function() {
      var theme = localStorage.getItem('velomind_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') document.documentElement.classList.add('light-theme');
    })();
  </script>
  <style>
    html { color-scheme: dark; background-color: #0a0b0f; }
    html[data-theme="light"] { color-scheme: light; background-color: #f8fafc; }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeloMind — Confirmar email</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #9ED62B;
      --primary-dark: #84B422;
      --bg: #0a0b0f;
      --bg-card: #1a1d26;
      --border: rgba(255,255,255,0.08);
      --text: #f0f2f5;
      --text-muted: #6b7280;
      --radius: 12px;
    }
    html[data-theme="light"] {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --border: rgba(0,0,0,0.1);
      --text: #1e293b;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 60px rgba(158,214,43,0.06);
      text-align: center;
    }
    .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      width: 100%;
      background: var(--primary);
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(158,214,43,0.3); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 10px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.03); box-shadow: none; transform: none; }
    input.form-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin-bottom: 12px;
      outline: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">🚴 VeloMind</div>

  <div id="state-ok" style="display:none">
    <div class="icon">✅</div>
    <h1>¡Email confirmado!</h1>
    <p>Tu cuenta ya está verificada. Ya podés iniciar sesión normalmente.</p>
    <a href="login.html" class="btn"><i class="fas fa-arrow-right"></i> Ir al login</a>
  </div>

  <div id="state-error" style="display:none">
    <div class="icon">⚠️</div>
    <h1 id="error-title">Enlace inválido</h1>
    <p id="error-desc">Este enlace no existe, ya fue utilizado o expiró.</p>
    <input type="email" class="form-input" id="resend-email" placeholder="Tu email">
    <button class="btn" onclick="resend()">
      <span id="resend-label"><i class="fas fa-paper-plane"></i> Reenviar email de confirmación</span>
    </button>
    <a href="login.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver al login</a>
  </div>
</div>

<script>
  window.API_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3000/api'
    : 'https://velomind-backend.onrender.com/api';

  const status = new URLSearchParams(location.search).get('status');
  const MESSAGES = {
    expired: ['Enlace expirado', 'Este enlace de confirmación ya venció. Pedí uno nuevo con tu email.'],
    invalid: ['Enlace inválido', 'Este enlace no existe o ya fue utilizado.'],
    missing: ['Falta el enlace', 'Abrí el enlace completo desde el email que te enviamos.'],
    error:   ['Algo salió mal', 'No pudimos confirmar tu email. Intentá de nuevo.'],
  };

  if (status === 'ok') {
    document.getElementById('state-ok').style.display = 'block';
  } else {
    document.getElementById('state-error').style.display = 'block';
    const [title, desc] = MESSAGES[status] || MESSAGES.error;
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-desc').textContent = desc;
  }

  async function resend() {
    const email = document.getElementById('resend-email').value.trim();
    if (!email) { alert('Escribí tu email primero.'); return; }
    const label = document.getElementById('resend-label');
    label.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
    try {
      const res = await fetch(`${API_URL}/auth/resend-verification`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      label.innerHTML = '<i class="fas fa-check"></i> Enviado';
      alert(data.message || 'Si la cuenta existe, te reenviamos el email.');
    } catch (e) {
      label.innerHTML = '<i class="fas fa-paper-plane"></i> Reenviar email de confirmación';
      alert('Error de conexión. Intentá de nuevo.');
    }
  }
</script>
</body>
</html>
